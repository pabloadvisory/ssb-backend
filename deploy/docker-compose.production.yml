name: ssb-backend

x-app: &app
  image: ssb-backend:production
  build:
    context: ..
    dockerfile: Dockerfile
  environment: &app-environment
    SSB_ENV: production
    SSB_LOG_LEVEL: info
    SSB_HTTP_ADDR: :8080
    SSB_DATABASE_URL: postgres://ssb:${SSB_POSTGRES_PASSWORD:?set SSB_POSTGRES_PASSWORD}@postgres:5432/ssb?sslmode=disable
    SSB_DATABASE_MIN_CONNS: 2
    SSB_DATABASE_MAX_CONNS: 20
    SSB_INGEST_API_KEY: ${SSB_INGEST_API_KEY:?set SSB_INGEST_API_KEY}
    SSB_EDITORIAL_API_KEY: ${SSB_EDITORIAL_API_KEY:-}
    SSB_TRUSTED_PROXY_CIDRS: 127.0.0.0/8,::1/128

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ssb
      POSTGRES_USER: ssb
      POSTGRES_PASSWORD: ${SSB_POSTGRES_PASSWORD:?set SSB_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssb -d ssb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    environment:
      <<: *app-environment
    ports:
      - "127.0.0.1:8788:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ssb", "healthcheck", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
