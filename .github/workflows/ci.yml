name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ssb_test
          POSTGRES_USER: ssb
          POSTGRES_PASSWORD: ssb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ssb -d ssb_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SSB_TEST_DATABASE_URL: postgres://ssb:ssb@localhost:5432/ssb_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go build -trimpath ./cmd/ssb
